<!-- =====================================================
     RULE #19 — NEVER DESTROY WORKING FOUNDATIONS
====================================================== -->

<rule>

    When adding a new feature:

    1. Inspect the existing architecture.
    2. Reuse existing components where possible.
    3. Modify rather than duplicate.
    4. Test the affected page.
    5. Check that existing pages still work.
    6. Consolidate the change.
    7. Document what changed.

</rule>
